<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Red Ball Game</title>
    <link rel="stylesheet" href="style.css" />
</head>
<body>
<div id="gameWrapper">
    <div id="gameContainer">
        <canvas id="game" width="900" height="550"></canvas>
        <div id="mainMenu">
            <h1>Red Ball</h1>
            <p>Roll, jump, and collect stars!</p>
            <button class="menuBtn" id="playBtn">Play</button>
            <button class="soundMenuBtn" id="btnSoundMenu" title="Toggle Sound">
                <svg id="menuSoundIconOn" viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5" fill="currentColor"/>
                    <path d="M15.54 8.46a5 5 0 0 1 0 7.07"/>
                    <path d="M19.07 4.93a10 10 0 0 1 0 14.14"/>
                </svg>
                <svg id="menuSoundIconOff" class="hidden-icon" viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5" fill="currentColor"/>
                    <line x1="23" y1="9" x2="17" y2="15"/>
                    <line x1="17" y1="9" x2="23" y2="15"/>
                </svg>
                <span id="menuSoundLabel">Sound: ON</span>
            </button>
        </div>
        <!-- HUD Buttons (Pause, Home & Sound) -->
        <div id="hudButtons">
            <button class="hudBtn" id="btnMute" title="Toggle Sound (M)">
                <svg id="hudSoundIconOn" viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5" fill="currentColor"/>
                    <path d="M15.54 8.46a5 5 0 0 1 0 7.07"/>
                    <path d="M19.07 4.93a10 10 0 0 1 0 14.14"/>
                </svg>
                <svg id="hudSoundIconOff" class="hidden-icon" viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5" fill="currentColor"/>
                    <line x1="23" y1="9" x2="17" y2="15"/>
                    <line x1="17" y1="9" x2="23" y2="15"/>
                </svg>
            </button>
            <button class="hudBtn" id="btnPause" title="Pause (Esc)">
                <svg viewBox="0 0 24 24" width="22" height="22" fill="none">
                    <rect x="6" y="4" width="4" height="16" rx="1" fill="currentColor"/>
                    <rect x="14" y="4" width="4" height="16" rx="1" fill="currentColor"/>
                </svg>
            </button>
            <button class="hudBtn" id="btnHome" title="Home">
                <svg viewBox="0 0 24 24" width="22" height="22" fill="none">
                    <path d="M3 12l9-9 9 9" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
                    <path d="M5 10v9a1 1 0 001 1h4v-5h4v5h4a1 1 0 001-1v-9" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                </svg>
            </button>
        </div>
        <!-- Pause Overlay -->
        <div id="pauseOverlay">
            <div id="pausePanel">
                <h2>Paused</h2>
                <p id="pauseLevelInfo"></p>
                <button class="menuBtn pauseMenuBtn" id="btnResume">
                    <svg viewBox="0 0 24 24" width="20" height="20" fill="currentColor" style="margin-right:8px;vertical-align:middle;"><polygon points="5,3 19,12 5,21"/></svg>
                    Resume
                </button>
                <button class="menuBtn pauseMenuBtn" id="btnRestart">
                    <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" style="margin-right:8px;vertical-align:middle;"><polyline points="23 4 23 10 17 10"/><path d="M20.49 15a9 9 0 1 1-2.12-9.36L23 10"/></svg>
                    Restart Level
                </button>
                <button class="menuBtn pauseMenuBtn" id="btnHomeMenu">
                    <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" style="margin-right:8px;vertical-align:middle;"><path d="M3 12l9-9 9 9"/><path d="M5 10v9a1 1 0 001 1h4v-5h4v5h4a1 1 0 001-1v-9"/></svg>
                    Main Menu
                </button>
            </div>
        </div>
        <div id="overlay">
            <h2 id="overlayTitle">Level Complete!</h2>
            <p id="overlayText">Stars: 3/3</p>
            <button class="menuBtn" id="overlayBtn">Next Level</button>
        </div>
        <!-- Pixel-Art Game Over Overlay -->
        <div id="gameOverOverlay">
            <div id="gameOverContainer">
                <div class="pixel-game-over-title" aria-label="GAME OVER">
                    <div class="pixel-word" data-text="GAME">GAME</div>
                    <div class="pixel-word" data-text="OVER">OVER</div>
                </div>
                <div class="pixel-score-banner">
                    <div class="score-main">
                        <span class="score-label">YOUR SCORE:</span>
                        <span class="score-val" id="gameOverScoreVal">0</span>
                    </div>
                    <div class="score-sub">
                        <span class="best-label">BEST SCORE:</span>
                        <span class="best-val" id="gameOverBestVal">0</span>
                    </div>
                </div>
                <div class="pixel-btn-group">
                    <button class="arcade-btn arcade-btn--restart" id="btnGameOverRestart" type="button">
                        <span class="arcade-btn__text">RESTART</span>
                    </button>
                    <button class="arcade-btn arcade-btn--menu" id="btnGameOverMenu" type="button">
                        <span class="arcade-btn__text">MENU</span>
                    </button>
                </div>
            </div>
        </div>
    </div>
    <!-- Mobile Touch Controls (below game screen) -->
    <div id="mobileControls">
        <div id="mobileLeft">
            <button class="touchBtn" id="btnLeft" data-key="ArrowLeft">
                <svg viewBox="0 0 24 24" width="32" height="32"><path d="M15 19l-7-7 7-7" stroke="currentColor" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg>
            </button>
            <button class="touchBtn" id="btnRight" data-key="ArrowRight">
                <svg viewBox="0 0 24 24" width="32" height="32"><path d="M9 5l7 7-7 7" stroke="currentColor" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg>
            </button>
        </div>
        <div id="mobileRight">
            <button class="touchBtn touchBtn--jump" id="btnJump" data-key="ArrowUp">
                <svg viewBox="0 0 24 24" width="28" height="28"><path d="M12 5l-7 7h4v7h6v-7h4z" fill="currentColor"/></svg>
            </button>
        </div>
    </div>
</div>
<script src="redball.js"></script>
</body>
</html>
